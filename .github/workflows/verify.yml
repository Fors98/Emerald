name: Verify Emerald
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -f backend/pom.xml clean verify
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/review-browser.cjs
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check admin.js && node --check script.js && node --check cms.js
      - run: docker compose --env-file .env.example config --quiet
      - run: docker build -t emerald-api:verify .
      - run: docker build -f deploy/Dockerfile.edge -t emerald-edge:verify .
