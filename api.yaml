{
  "openapi": "3.0.3",
  "info": {
    "title": "Emerald API",
    "version": "1.0.0",
    "description": "Same-origin session API. Obtain /auth/csrf before login and again after login; send its headerName/token for every authenticated mutation. Validation 400, anonymous 401, CSRF 403, missing 404, stale version 409, throttled 429. Versions: -1 creates a CMS override; existing writes/reset require returned version."
  },
  "servers": [
    {
      "url": "/api"
    }
  ],
  "paths": {
    "/actuator/health": {
      "get": {
        "summary": "Database health",
        "responses": {
          "200": {
            "description": "Success"
          }
        }
      }
    },
    "/content": {
      "get": {
        "summary": "Public text and image URL overrides as key/value map",
        "responses": {
          "200": {
            "description": "Success"
          }
        }
      }
    },
    "/contact": {
      "post": {
        "summary": "Create enquiry: name, email, message (10\u20135000 chars), optional company/projectType",
        "responses": {
          "201": {
            "description": "Success"
          }
        }
      }
    },
    "/auth/csrf": {
      "get": {
        "summary": "Get token and headerName",
        "responses": {
          "200": {
            "description": "Success"
          }
        }
      }
    },
    "/auth/login": {
      "post": {
        "summary": "Sign in using form-urlencoded username/password and CSRF header",
        "responses": {
          "200": {
            "description": "Success"
          }
        }
      }
    },
    "/auth/me": {
      "get": {
        "summary": "Current administrator identity",
        "responses": {
          "200": {
            "description": "Success"
          }
        },
        "security": [
          {
            "session": []
          }
        ]
      }
    },
    "/auth/logout": {
      "post": {
        "summary": "Invalidate session; CSRF required",
        "responses": {
          "200": {
            "description": "Success"
          }
        },
        "security": [
          {
            "session": []
          }
        ]
      }
    },
    "/admin/contacts": {
      "get": {
        "summary": "Paginated enquiries: page=0, size=20 (maximum100)",
        "responses": {
          "200": {
            "description": "Success"
          }
        },
        "security": [
          {
            "session": []
          }
        ]
      }
    },
    "/admin/contacts/{id}": {
      "patch": {
        "summary": "Update status (NEW/IN_PROGRESS/CLOSED), notes (max5000) and version",
        "responses": {
          "200": {
            "description": "Success"
          }
        },
        "security": [
          {
            "session": []
          }
        ],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ]
      }
    },
    "/admin/content": {
      "get": {
        "summary": "All overrides: key maps to value and version",
        "responses": {
          "200": {
            "description": "Success"
          }
        },
        "security": [
          {
            "session": []
          }
        ]
      }
    },
    "/admin/content/{key}": {
      "put": {
        "summary": "Save value (nonblank max20000) and version; allowed keys in content-keys.txt",
        "responses": {
          "200": {
            "description": "Success"
          }
        },
        "security": [
          {
            "session": []
          }
        ],
        "parameters": [
          {
            "name": "key",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ]
      },
      "delete": {
        "summary": "Reset override using required version query parameter",
        "responses": {
          "204": {
            "description": "Success"
          }
        },
        "security": [
          {
            "session": []
          }
        ],
        "parameters": [
          {
            "name": "key",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "version",
            "in": "query",
            "required": true,
            "schema": {
              "type": "integer",
              "format": "int64"
            }
          }
        ]
      }
    },
    "/admin/media": {
      "post": {
        "summary": "Upload multipart file: PNG/JPEG up to5MB and16MP; returns url",
        "responses": {
          "200": {
            "description": "Success"
          }
        },
        "security": [
          {
            "session": []
          }
        ]
      }
    },
    "/media/{filename}": {
      "get": {
        "summary": "Public sanitized image",
        "responses": {
          "200": {
            "description": "Success"
          }
        },
        "parameters": [
          {
            "name": "filename",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ]
      }
    },
    "/admin/audit": {
      "get": {
        "summary": "Change history: page=0, fixed 50 events per page",
        "responses": {
          "200": {
            "description": "Success"
          }
        },
        "security": [
          {
            "session": []
          }
        ]
      }
    }
  },
  "components": {
    "securitySchemes": {
      "session": {
        "type": "apiKey",
        "in": "cookie",
        "name": "JSESSIONID"
      }
    }
  }
}
