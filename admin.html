<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Emerald Digital Studio</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#020302">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpolygon points='12,1 20,7 24,15 16,23 8,23 0,15 4,7' fill='%2322c08a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin">

<header class="admin-bar">
  <a href="index.html" class="wordmark">EMERALD<small>Admin</small></a>
  <div class="admin-bar-right">
    <span id="adminUser" class="admin-user"></span>
    <button type="button" class="btn btn-ghost btn-sm" id="logoutBtn" hidden>Sign out</button>
  </div>
</header>

<div class="demo-banner" id="demoBanner" role="status" hidden>
  Demo mode — the backend at <code id="demoBase"></code> is not reachable, so you are looking at sample data.
  Nothing you change here is saved.
</div>

<main class="admin-main">

  <!-- LOGIN -->
  <section class="login-card" id="loginView" aria-labelledby="loginTitle">
    <h1 id="loginTitle">Sign in</h1>
    <p class="muted">Staff only. Uses <code>POST /api/auth/login</code>.</p>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="l-email">Email</label>
        <input type="email" id="l-email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="l-password">Password</label>
        <input type="password" id="l-password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary">Sign in</button>
      <div class="form-status is-error" id="loginStatus" role="alert"></div>
    </form>
  </section>

  <!-- APP -->
  <div class="admin-app" id="appView" hidden>
    <nav class="admin-tabs" id="tabs" role="tablist" aria-label="Admin sections"></nav>
    <section class="admin-panel" id="panel" tabindex="-1" aria-live="polite"></section>
  </div>

</main>

<script src="api-client.js"></script>
<script src="admin.js"></script>
</body>
</html>
