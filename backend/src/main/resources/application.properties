spring.application.name=emerald-backend
server.port=8080
server.servlet.context-path=/api

spring.datasource.url=jdbc:postgresql://localhost:5432/emerald_db
spring.datasource.username=u0_a1232
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Do not keep a JPA session open for the whole request (avoids lazy-loading surprises in the filter chain).
spring.jpa.open-in-view=false

# Never put exception messages, stack traces or binding details into error responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ---------------------------------------------------------------------------
# Authentication (see auth/AuthProperties.java). Secrets come from the ENVIRONMENT only:
#   EMERALD_AUTH_JWT_SECRET            required  Base64, >= 32 bytes   (openssl rand -base64 48)
#   EMERALD_AUTH_ALLOWED_ORIGINS       required  e.g. https://emerald.example   (comma separated)
#   EMERALD_AUTH_BOOTSTRAP_EMAIL       first start only, creates the first admin
#   EMERALD_AUTH_BOOTSTRAP_PASSWORD    first start only, >= 14 characters; remove afterwards
# For local development without HTTPS use the 'local' profile
# (copy application-local.properties.example to application-local.properties, which is git-ignored).
# ---------------------------------------------------------------------------
emerald.auth.jwt.issuer=emerald-backend
emerald.auth.jwt.audience=emerald-admin
emerald.auth.jwt.access-ttl=10m
emerald.auth.refresh.idle-ttl=8h
emerald.auth.refresh.absolute-ttl=7d
emerald.auth.refresh.cookie-name=emerald_rt
emerald.auth.refresh.cookie-path=/api/auth
emerald.auth.refresh.cookie-secure=true
emerald.auth.lockout.max-failed-attempts=5
emerald.auth.lockout.lock-duration=15m
emerald.auth.lockout.ip-max-failures=10
emerald.auth.lockout.ip-window=15m
emerald.auth.require-https=true

# Behind a trusted reverse proxy (nginx, Caddy, a load balancer) that sets X-Forwarded-* itself, enable:
# server.forward-headers-strategy=framework
# Do NOT enable it when the app is reachable directly: clients could spoof their IP and dodge rate limiting.
