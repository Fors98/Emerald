spring.application.name=emerald-backend
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/emerald_db}
spring.datasource.username=${DB_USERNAME:emerald}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.tracking-modes=cookie
server.forward-headers-strategy=none
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.diskspace.enabled=false
emerald.admin.username=${EMERALD_ADMIN_USERNAME:admin}
emerald.admin.password-hash=${EMERALD_ADMIN_PASSWORD_HASH:}
emerald.media.directory=${EMERALD_MEDIA_DIR:./media}
